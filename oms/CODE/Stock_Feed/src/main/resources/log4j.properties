# LOG4J configuration
log4j.rootLogger=INFO, file
 
log4j.appender.file=org.apache.log4j.DailyRollingFileAppender
log4j.appender.file.File=/u01/oracle/Weblogic_RSB/user_projects/domains/RSBDomain/servers/AdminServer/OMS_logs/stock-feed.log
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%-5p] %c %x - %m%n
log4j.appender.RFA.DatePattern='.'yyyy-MM-dd

log4j.appender.file.Threshold = INFO
