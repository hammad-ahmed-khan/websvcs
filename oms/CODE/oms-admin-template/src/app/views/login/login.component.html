<div class="app-body">
    <main class="main d-flex align-items-center">
        <div class="container">
            <div class="row">
                <div class="col-md-8 mx-auto">
                    <div class="card-group">
                        <div class="card p-4">
                            <div class="card-body">
                                <form [formGroup]="loginForm" #form="ngForm" (ngSubmit)="validateUser()">
                                    <h1>Login</h1>
                                    <div class="input-group mb-3">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text"><i class="icon-user"></i></span>
                                        </div>
                                        <input type="text" class="form-control" formControlName="userName" placeholder="Username"
                                            autocomplete="username" required [ngClass]="{'is-invalid': form.submitted && loginForm.get('userName').hasError('required')}">
                                        <div *ngIf="form.submitted && loginForm.get('userName').hasError('required')" class="invalid-feedback">
                                            Please enter username
                                        </div>
                                    </div>
                                    <div class="input-group mb-4">
                                        <div class="input-group-prepend">
                                            <span class="input-group-text"><i class="icon-lock"></i></span>
                                        </div>
                                        <input type="password" class="form-control" formControlName="password" placeholder="Password"
                                            autocomplete="current-password" required [ngClass]="{'is-invalid': form.submitted && loginForm.get('password').hasError('required')}">
                                        <div *ngIf="form.submitted && loginForm.get('password').hasError('required')" class="invalid-feedback">
                                            Please enter password
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-6">
                                            <button type="submit" class="btn btn-primary px-4">Login</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                        <div class="card text-white bg-primary py-5 d-md-down-none" style="width:44%">
                            <div class="card-body text-center">
                                <div>
                                    <img src="assets/img/brand/logo-tp.png" class="navbar-brand-full w-100">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
