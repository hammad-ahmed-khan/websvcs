log4j.rootLogger=INFO, CA, FA,, RFA

#Console Appender
log4j.appender.CA=org.apache.log4j.ConsoleAppender
log4j.appender.CA.layout=org.apache.log4j.PatternLayout
log4j.appender.CA.layout.ConversionPattern==%d{yyyy-MM-dd HH:mm:ss}  %c %x - %m%n

#File Appender
log4j.appender.FA=org.apache.log4j.FileAppender
log4j.appender.FA.File=/u01/oracle/Weblogic_RSB/user_projects/domains/RSBDomain/servers/AdminServer/OMSCustomerOrder/OMSCustomerOrder.log



log4j.appender.FA.layout=org.apache.log4j.PatternLayout
log4j.appender.FA.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss}  %c - %m%n


#Rolling File Appender
log4j.appender.RFA=org.apache.log4j.RollingFileAppender
log4j.appender.RFA.layout=org.apache.log4j.PatternLayout
log4j.appender.RFA.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %c - %m%n
log4j.appender.RFA.File=/u01/oracle/Weblogic_RSB/user_projects/domains/RSBDomain/servers/AdminServer/OMSCustomerOrder/OMSCustomerOrder.log
log4j.appender.RFA.MaxFileSize=10KB
log4j.appender.RFA.MaxBackupIndex=5 

# Set the logger level of File Appender to WARN
log4j.appender.FA.Threshold = INFO
log4j.appender.CA.Threshold = INFO



