log4j.rootLogger=INFO, CA, FA 

#Console Appender
log4j.appender.CA=org.apache.log4j.ConsoleAppender
log4j.appender.CA.layout=org.apache.log4j.PatternLayout
log4j.appender.CA.layout.ConversionPattern==%d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c %x - %m%n

#File Appender
log4j.appender.FA=org.apache.log4j.FileAppender
log4j.appender.FA.File=/u01/oracle/Weblogic_RSB/user_projects/domains/RSBDomain/servers/AdminServer/logs/CustomerOrder.log

log4j.appender.FA.layout=org.apache.log4j.PatternLayout
log4j.appender.FA.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%-5p] %c - %m%n


# Set the logger level of File Appender to WARN
log4j.appender.FA.Threshold = INFO
log4j.appender.CA.Threshold = INFO
