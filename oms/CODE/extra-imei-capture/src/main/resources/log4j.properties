log4j.rootLogger=INFO, FA 

#File Appender
log4j.appender.FA=org.apache.log4j.RollingFileAppender
log4j.appender.FA.File=/u03/oracle/Weblogic_SIM/user_projects/domains/SIMDomain/servers/sim-server2/logs/imei-capture.log

log4j.appender.FA.layout=org.apache.log4j.PatternLayout
log4j.appender.FA.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%-5p] %c - %m%n


# Set the logger level of File Appender to WARN
log4j.appender.FA.Threshold = INFO

# Set max file size
log4j.appender.FA.MaxFileSize=100MB
# Keep 10 backup files
log4j.appender.FA.MaxBackupIndex=10
